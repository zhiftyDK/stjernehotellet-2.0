name: Byg Mac-version

# Kun manuel start: Actions -> "Byg Mac-version" -> Run workflow.
# Når den er færdig, henter du filerne under "Artifacts" nederst på kørslens side
# (Stjernehotellet-mac.zip indeholder .dmg + .zip for Apple Silicon og Intel).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build mac
      - uses: actions/upload-artifact@v4
        with:
          name: Stjernehotellet-mac
          path: dist/mac/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
