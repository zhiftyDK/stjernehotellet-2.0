name: Byg Windows-version

# Kun manuel start: Actions -> "Byg Windows-version" -> Run workflow.
# Når den er færdig, henter du installationsprogrammet under "Artifacts" nederst på kørslens side
# (Stjernehotellet-windows.zip indeholder Stjernehotellet-Setup.exe).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Sørg for at Inno Setup er installeret
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
      - run: npm ci
      - run: npm run build windows
      - uses: actions/upload-artifact@v4
        with:
          name: Stjernehotellet-windows
          path: dist/installer/Stjernehotellet-Setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
